# PR checks (docs/architecture/testing.md): lint, typecheck, unit + integration
# tests with coverage thresholds, and the Playwright smoke suite. Any failure
# or coverage drop blocks the merge once this job is a required check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wesal
          POSTGRES_PASSWORD: wesal
          POSTGRES_DB: wesal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wesal -d wesal_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://wesal:wesal@localhost:5432/wesal_test
      DATABASE_URL: postgres://wesal:wesal@localhost:5432/wesal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Fails when lines drop below 80% or branches below 70%.
      - run: npm run coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
